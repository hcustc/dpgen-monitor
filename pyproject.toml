[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dpgen-monitor"
version = "0.2.0"
description = "Configurable DP-GEN monitoring, DeepMD evaluation, and notification adapters"
readme = "README.md"
license = "MIT"
authors = [{ name = "hcustc" }]
requires-python = ">=3.11"
dependencies = [
  "dpdispatcher>=1.0.3,<2",
  "matplotlib",
  "numpy",
  "PyYAML>=6,<7",
  "requests",
  "requests-toolbelt",
  "scipy",
]

[project.scripts]
dpgen-monitor = "dpgen_monitor.cli:main"

[project.urls]
Homepage = "https://github.com/hcustc/dpgen-monitor"
Repository = "https://github.com/hcustc/dpgen-monitor"
Issues = "https://github.com/hcustc/dpgen-monitor/issues"

[tool.setuptools.packages.find]
include = ["dpgen_monitor*"]
